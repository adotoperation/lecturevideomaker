<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ lecture_meta.title }} - AI 판서 강의 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F1117;
      --card-bg: #181A20;
      --card-border: #2B303C;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #38BDF8;
      --accent: #6366F1;
      --stage-bg: #16181F;

      /* 에이닷 문장분석 토큰 표준 색상 */
      --token-blue: #38BDF8;      /* 주어 (S) */
      --token-rose: #FB7185;      /* 동사 (Vi, Vt) */
      --token-emerald: #34D399;   /* 목적어 (O) */
      --token-indigo: #818CF8;    /* 주격보어 (SC) */
      --token-purple: #C084FC;    /* 목적격보어 (OC) */
      --token-slate: #CBD5E1;     /* 일반 단어/수식어 */
      --pen-note: #FDE047;        /* 손글씨 메모 노란색 */
      --pen-hl: rgba(254, 240, 138, 0.45); /* 형광펜 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* 상단 네비게이션 */
    .top-nav {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--primary); }

    .action-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-generate {
      background: linear-gradient(135deg, #6366F1, #38BDF8);
      color: #FFF;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
    }
    .btn-generate:hover {
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.7);
      transform: translateY(-1px);
    }
    .btn-drive {
      background: #1E2330;
      border-color: #334155;
      color: #E2E8F0;
    }
    .btn-drive:hover {
      background: #2D3748;
      border-color: #475569;
    }

    /* 16:9 슬라이드 비디오 캔버스 */
    .stage-wrapper {
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background: var(--stage-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    /* 슬라이드 헤더 */
    .slide-header {
      position: absolute;
      top: 32px;
      left: 48px;
      right: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .title-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .sentence-counter {
      font-size: 13px;
      font-weight: 700;
      color: #94A3B8;
      background: #1E2430;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #333C4E;
    }

    /* 문장 텍스트 렌더링 컨테이너 */
    .sentence-container {
      position: absolute;
      top: 100px;
      left: 54px;
      right: 280px; /* 우측 강사 PIP 공간 확보 */
      bottom: 100px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 32px;
      z-index: 5;
    }

    .sentence-block {
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      font-size: 26px;
      font-weight: 600;
      line-height: 2.7;
      word-spacing: 5px;
      letter-spacing: 0.2px;
      position: relative;
    }

    /* 토큰 렌더링 (에이닷 표준 규정) */
    .token-box {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin: 0 4px;
      vertical-align: middle;
    }

    /* 상단 라벨 (top_label: O, Vt, Vi 등) */
    .token-top-label {
      font-size: 11px;
      font-weight: 800;
      color: #94A3B8;
      line-height: 1;
      height: 14px;
      margin-bottom: 2px;
    }

    /* 본문 단어 */
    .token-word {
      position: relative;
      color: #F8FAFC;
      transition: color 0.2s;
    }
    .token-word.color-rose { color: var(--token-rose); }
    .token-word.color-blue { color: var(--token-blue); }
    .token-word.color-emerald { color: var(--token-emerald); }
    .token-word.color-indigo { color: var(--token-indigo); }
    .token-word.color-purple { color: var(--token-purple); }
    .token-word.color-slate { color: var(--token-slate); }

    .token-word.has-underline::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 2px;
      background: currentColor;
    }

    /* 접속사 세모 기호 (Overlay) */
    .conjunction-triangle {
      position: absolute;
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: none;
    }
    .conjunction-triangle.visible {
      display: block;
    }

    /* 하단 성분 태그 (sub_tag: S, Vi, Vt, SC, O) */
    .token-sub-tag {
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
      height: 16px;
      margin-top: 3px;
      letter-spacing: 0.5px;
    }
    .token-sub-tag.tag-S { color: var(--token-blue); font-size: 14px; }
    .token-sub-tag.tag-Vi, .token-sub-tag.tag-Vt { color: var(--token-rose); font-size: 14px; }
    .token-sub-tag.tag-O, .token-sub-tag.tag-DO { color: var(--token-emerald); }
    .token-sub-tag.tag-SC { color: var(--token-indigo); }
    .token-sub-tag.tag-OC { color: var(--token-purple); }

    /* 끊어읽기 슬래시 */
    .chunk-slash {
      color: #64748B;
      font-weight: 400;
      margin: 0 6px;
    }

    /* 단어 상단 손글씨 메모 */
    .note-bubble {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(2px);
      font-family: 'Nanum Pen Script', cursive;
      font-size: 20px;
      color: var(--pen-note);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: all 0.3s ease;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .note-bubble.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(-2px);
    }

    /* SVG 판서 레이어 */
    .ink-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 8;
    }
    .ink-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke-dashoffset 0.05s linear;
    }
    .pen-tip {
      fill: #FFFFFF;
      stroke: #38BDF8;
      stroke-width: 2px;
      opacity: 0;
      transition: opacity 0.15s;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8));
    }
    .pen-tip.drawing { opacity: 1; }

    /* 하단 강사 해설 자막 */
    .caption-banner {
      position: absolute;
      bottom: 24px;
      left: 48px;
      right: 280px;
      height: 52px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      font-size: 15px;
      color: #E2E8F0;
      gap: 12px;
      z-index: 10;
    }
    .mic-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* 우하단 말하는 AI 강사 PIP */
    .teacher-pip {
      position: absolute;
      bottom: 24px;
      right: 36px;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: #1E293B;
      border: 3px solid var(--primary);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4), 0 20px 30px rgba(0, 0, 0, 0.7);
      overflow: hidden;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .audio-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.6);
      pointer-events: none;
      opacity: 0;
    }
    .audio-ring.speaking {
      animation: ringSpread 1.6s infinite ease-out;
    }
    @keyframes ringSpread {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 0; }
    }

    .talking-avatar-svg {
      width: 170px;
      height: 170px;
      margin-top: 15px;
      transform-origin: bottom center;
    }

    .teacher-badge {
      position: absolute;
      bottom: 8px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.5);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      backdrop-filter: blur(4px);
      letter-spacing: 0.3px;
    }

    /* 컨트롤 패널 */
    .control-panel {
      width: 100%;
      max-width: 1200px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      margin-top: 16px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .timeline-bar-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .time-display {
      font-family: monospace;
      font-size: 14px;
      color: var(--text-muted);
      min-width: 100px;
    }

    .timeline-slider {
      flex: 1;
      accent-color: var(--primary);
      height: 6px;
      border-radius: 3px;
      cursor: pointer;
    }

    .button-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .main-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-navigator {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
    }
    .step-chip {
      background: #1F2430;
      border: 1px solid #333C4E;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      color: #94A3B8;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .step-chip.active {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      font-weight: 700;
    }

    /* 로딩 인디케이터 */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      gap: 16px;
    }
    .loading-overlay.active { display: flex; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 -->
  <div class="top-nav">
    <a href="/" class="back-link">
      <span>← 교안 목록으로 돌아가기</span>
    </a>
    <div class="action-group">
      <button class="btn btn-generate" id="btn-generate" onclick="generateLecture()">
        <span>⚡ 1-클릭 AI 강의 생성</span>
      </button>
      <button class="btn btn-drive" id="btn-drive" onclick="uploadToGoogleDrive()">
        <span>☁️ 구글 드라이브 업로드</span>
      </button>
    </div>
  </div>

  <!-- 16:9 슬라이드 비디오 캔버스 -->
  <div class="stage-wrapper" id="stage">
    
    <!-- 로딩 오버레이 -->
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <div style="font-size: 16px; font-weight: 700;" id="loading-msg">Gemini AI가 강의 대본과 판서 궤적을 생성 중입니다...</div>
      <div style="font-size: 13px; color: #94A3B8;">(약 10~20초 소요됩니다)</div>
    </div>

    <!-- 슬라이드 헤더 -->
    <div class="slide-header">
      <div class="title-pill">
        <span>📘 {{ lecture_meta.title }}</span>
      </div>
      <div class="sentence-counter" id="sentence-counter">
        문장 [ 1 / {{ lecture_meta.analysis_data.sentences|length }} ]
      </div>
    </div>

    <!-- 문장 텍스트 렌더링 컨테이너 -->
    <div class="sentence-container" id="sentence-container">
      <!-- JS에서 현재 문장의 토큰들을 동적으로 렌더링 -->
    </div>

    <!-- 실시간 손글씨 판서 SVG 오버레이 -->
    <svg class="ink-layer" id="ink-layer">
      <g id="ink-paths-group"></g>
      <circle id="pen-stylus" class="pen-tip" cx="0" cy="0" r="4.5" />
    </svg>

    <!-- 하단 강사 해설 자막 바 -->
    <div class="caption-banner">
      <div class="mic-dot"></div>
      <div id="caption-text">우측 상단 [⚡ 1-클릭 AI 강의 생성]을 눌러 강의를 시작하세요!</div>
    </div>

    <!-- 우하단 말하는 AI 강사 PIP -->
    <div class="teacher-pip">
      <div class="audio-ring" id="audio-ring"></div>
      
      <!-- 토킹 아바타 벡터 일러스트 -->
      <svg class="talking-avatar-svg" id="avatar-svg" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="avatarHair" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2D3748"/>
            <stop offset="100%" stop-color="#1A202C"/>
          </linearGradient>
          <linearGradient id="avatarShirt" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="100%" stop-color="#0284C7"/>
          </linearGradient>
        </defs>
        <!-- 셔츠 -->
        <path d="M 45 190 Q 100 160 155 190 L 170 210 L 30 210 Z" fill="url(#avatarShirt)"/>
        <polygon points="100,165 85,185 100,195 115,185" fill="#FFFFFF"/>
        <!-- 목 -->
        <rect x="88" y="130" width="24" height="28" rx="4" fill="#FBD38D"/>
        <!-- 얼굴 -->
        <path d="M 68 85 C 68 60 132 60 132 85 C 132 120 118 145 100 145 C 82 145 68 120 68 85 Z" fill="#FEEBC8"/>
        <!-- 앞머리 -->
        <path d="M 65 80 C 75 55 125 55 135 80 C 120 70 100 70 85 75 C 75 78 70 82 65 80 Z" fill="url(#avatarHair)"/>
        <!-- 눈 -->
        <g id="avatar-eyes">
          <ellipse cx="85" cy="94" rx="4.5" ry="5.5" fill="#1A202C"/>
          <circle cx="86.5" cy="92.5" r="1.5" fill="#FFFFFF"/>
          <ellipse cx="115" cy="94" rx="4.5" ry="5.5" fill="#1A202C"/>
          <circle cx="116.5" cy="92.5" r="1.5" fill="#FFFFFF"/>
        </g>
        <!-- 안경 -->
        <rect x="76" y="87" width="18" height="14" rx="4" fill="none" stroke="#64748B" stroke-width="1.8"/>
        <rect x="106" y="87" width="18" height="14" rx="4" fill="none" stroke="#64748B" stroke-width="1.8"/>
        <line x1="94" y1="93" x2="106" y2="93" stroke="#64748B" stroke-width="1.8"/>
        <!-- 코 -->
        <path d="M 100 95 L 97 106 L 102 106" stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <!-- 입 (립싱크 타겟) -->
        <g id="avatar-mouth">
          <ellipse id="mouth-shape" cx="100" cy="120" rx="7" ry="2" fill="#E53E3E"/>
        </g>
      </svg>

      <div class="teacher-badge">AI Grace 쌤 (에이닷)</div>
    </div>

  </div>

  <!-- 컨트롤 패널 -->
  <div class="control-panel">
    <div class="timeline-bar-wrapper">
      <span class="time-display" id="time-display">00:00 / 00:00</span>
      <input type="range" class="timeline-slider" id="timeline-slider" min="0" max="100" step="0.1" value="0">
    </div>

    <div class="button-row">
      <div class="main-controls">
        <button class="btn btn-generate" id="play-btn" onclick="togglePlay()">
          <span id="play-icon">▶</span>
          <span id="play-text">강의 시작</span>
        </button>
        <button class="btn btn-drive" onclick="restartLecture()">↺ 처음부터</button>
        <button class="btn btn-drive" onclick="nextSentence()">다음 문장 ⏩</button>
      </div>

      <!-- 배속 선택 -->
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12px; color: #94A3B8;">배속:</span>
        <button class="btn btn-drive" style="padding: 4px 10px;" onclick="setSpeed(1.0)">1.0x</button>
        <button class="btn btn-drive" style="padding: 4px 10px;" onclick="setSpeed(1.25)">1.25x</button>
      </div>
    </div>

    <!-- 단계별 바로가기 칩 스트립 -->
    <div class="step-navigator" id="step-navigator"></div>
  </div>

  <script>
    const ROW_INDEX = {{ row_index }};
    const RAW_SENTENCES = {{ lecture_meta.analysis_data.sentences | tojson | safe }};
    
    let currentLecture = null; // API에서 받아올 생성된 강의 데이터
    let currentSentenceIndex = 1;
    let currentSegmentIndex = 0;
    let isPlaying = false;
    let playbackSpeed = 1.0;
    let audioElement = new Audio();

    // 초기 문장 토큰 화면 렌더링
    function renderSentenceTokens(sentenceIndex) {
      const sentence = RAW_SENTENCES.find(s => s.index === sentenceIndex) || RAW_SENTENCES[0];
      if (!sentence) return;

      document.getElementById("sentence-counter").textContent = `문장 [ ${sentence.index} / ${RAW_SENTENCES.length} ]`;
      const container = document.getElementById("sentence-container");
      container.innerHTML = "";

      const block = document.createElement("div");
      block.className = "sentence-block";

      (sentence.tokens || []).forEach((t, idx) => {
        if (t.text === " / ") {
          const slash = document.createElement("span");
          slash.className = "chunk-slash";
          slash.textContent = "/";
          block.appendChild(slash);
          return;
        }

        const box = document.createElement("div");
        box.className = "token-box";
        box.id = `token-${sentenceIndex}-${idx}`;

        // 상단 라벨 (top_label: O, Vt, Vi 등)
        const topEl = document.createElement("div");
        topEl.className = "token-top-label";
        topEl.textContent = t.top_label || "";
        box.appendChild(topEl);

        // 본문 단어
        const wordEl = document.createElement("div");
        wordEl.className = `token-word color-${t.color || 'slate'} ${t.underline ? 'has-underline' : ''}`;
        wordEl.textContent = t.text;
        
        // 접속사 세모 기호 (SVG)
        if (t.is_conjunction || t.top_label === "△") {
          const triSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          triSvg.setAttribute("class", "conjunction-triangle");
          triSvg.setAttribute("viewBox", "0 0 40 30");
          triSvg.innerHTML = `<polygon points="20,2 2,28 38,28" fill="none" stroke="#F59E0B" stroke-width="2.5" />`;
          wordEl.appendChild(triSvg);
        }

        // 손글씨 메모 요소
        const noteEl = document.createElement("div");
        noteEl.className = "note-bubble";
        noteEl.id = `note-${sentenceIndex}-${idx}`;
        wordEl.appendChild(noteEl);

        box.appendChild(wordEl);

        // 하단 성분 태그 (sub_tag: S, Vi, Vt, SC, O)
        const subEl = document.createElement("div");
        subEl.className = `token-sub-tag tag-${t.sub_tag || ''}`;
        subEl.textContent = t.sub_tag || "";
        box.appendChild(subEl);

        block.appendChild(box);
      });

      container.appendChild(block);
    }

    // 1-클릭 AI 강의 생성 호출
    async function generateLecture() {
      const overlay = document.getElementById("loading-overlay");
      overlay.classList.add("active");

      try {
        const res = await fetch(`/api/generate/${ROW_INDEX}`, { method: "POST" });
        const data = await res.json();
        if (data.status === "success") {
          currentLecture = data;
          overlay.classList.remove("active");
          alert("🎉 AI 강의 대본 및 음성 합성이 완료되었습니다! [강의 시작]을 누르세요.");
          initPlaybackTimeline();
        } else {
          alert("생성 실패: " + data.message);
          overlay.classList.remove("active");
        }
      } catch (err) {
        alert("오류 발생: " + err.message);
        overlay.classList.remove("active");
      }
    }

    // 재생 타임라인 초기화
    function initPlaybackTimeline() {
      if (!currentLecture || !currentLecture.audio) return;
      const segments = currentLecture.audio.segments || [];
      const strip = document.getElementById("step-navigator");
      strip.innerHTML = "";

      segments.forEach((seg, idx) => {
        const chip = document.createElement("div");
        chip.className = "step-chip";
        chip.id = `chip-${idx}`;
        chip.textContent = seg.title;
        chip.onclick = () => playSegment(idx);
        strip.appendChild(chip);
      });

      document.getElementById("timeline-slider").max = currentLecture.audio.total_lecture_duration;
      playSegment(0);
    }

    // 세그먼트 재생
    function playSegment(index) {
      if (!currentLecture) return;
      const segments = currentLecture.audio.segments;
      if (index >= segments.length) return;

      currentSegmentIndex = index;
      const seg = segments[index];

      // 활성 칩 표시
      document.querySelectorAll(".step-chip").forEach((c, i) => {
        c.classList.toggle("active", i === index);
      });

      // 해당 문장으로 슬라이드 전환
      if (seg.sentence_index && seg.sentence_index !== currentSentenceIndex) {
        currentSentenceIndex = seg.sentence_index;
        renderSentenceTokens(currentSentenceIndex);
      }

      // 자막 업데이트
      document.getElementById("caption-text").textContent = seg.narration;

      // 오디오 로드 및 재생
      audioElement.src = seg.relative_audio_path;
      audioElement.playbackRate = playbackSpeed;
      audioElement.play();
      isPlaying = true;
      document.getElementById("play-icon").textContent = "⏸";
      document.getElementById("play-text").textContent = "일시정지";

      // 오디오 끝났을 때 다음 세그먼트 자동 진행
      audioElement.onended = () => {
        if (currentSegmentIndex + 1 < segments.length) {
          playSegment(currentSegmentIndex + 1);
        } else {
          isPlaying = false;
          document.getElementById("play-icon").textContent = "▶";
          document.getElementById("play-text").textContent = "강의 재개";
        }
      };

      // 판서 액션 트리거
      triggerChalkActions(seg.actions);
    }

    function togglePlay() {
      if (!currentLecture) {
        generateLecture();
        return;
      }
      if (isPlaying) {
        audioElement.pause();
        isPlaying = false;
        document.getElementById("play-icon").textContent = "▶";
        document.getElementById("play-text").textContent = "강의 재개";
      } else {
        audioElement.play();
        isPlaying = true;
        document.getElementById("play-icon").textContent = "⏸";
        document.getElementById("play-text").textContent = "일시정지";
      }
    }

    function restartLecture() {
      playSegment(0);
    }

    function nextSentence() {
      if (currentSentenceIndex < RAW_SENTENCES.length) {
        currentSentenceIndex++;
        renderSentenceTokens(currentSentenceIndex);
        // 해당 문장의 첫 번째 세그먼트 찾기
        if (currentLecture) {
          const nextIdx = currentLecture.audio.segments.findIndex(s => s.sentence_index === currentSentenceIndex);
          if (nextIdx !== -1) playSegment(nextIdx);
        }
      }
    }

    function setSpeed(spd) {
      playbackSpeed = spd;
      audioElement.playbackRate = spd;
    }

    // 판서 액션 애니메이션 트리거
    function triggerChalkActions(actions) {
      if (!actions || !actions.length) return;
      actions.forEach(act => {
        if (act.type === "draw_triangle") {
          // 세모 표시
          document.querySelectorAll(".conjunction-triangle").forEach(el => el.classList.add("visible"));
        } else if (act.type === "highlight") {
          // 형광펜 애니메이션
          const inkGroup = document.getElementById("ink-paths-group");
          // 슬라이드 내 목표 요소 위치 기반 SVG 획 그리기
        }
      });
    }

    // 강사 아바타 립싱크 루프
    function updateAvatarMotion() {
      const audioRing = document.getElementById("audio-ring");
      const mouthShape = document.getElementById("mouth-shape");
      const avatarSvg = document.getElementById("avatar-svg");

      if (isPlaying && !audioElement.paused) {
        audioRing.classList.add("speaking");
        const t = performance.now() / 1000;
        const mouthOpen = 2 + Math.abs(Math.sin(t * 16)) * 6;
        mouthShape.setAttribute("ry", mouthOpen.toFixed(1));
        const headTilt = Math.sin(t * 4) * 2;
        avatarSvg.style.transform = `rotate(${headTilt}deg)`;
      } else {
        audioRing.classList.remove("speaking");
        mouthShape.setAttribute("ry", "1.5");
        avatarSvg.style.transform = "none";
      }
      requestAnimationFrame(updateAvatarMotion);
    }

    // 구글 드라이브 업로드 호출
    async function uploadToGoogleDrive() {
      if (!currentLecture) {
        alert("먼저 강의 생성을 완료해주세요!");
        return;
      }
      const btn = document.getElementById("btn-drive");
      btn.textContent = "⏳ 드라이브 업로드 중...";
      btn.disabled = true;

      try {
        const payload = {
          local_path: currentLecture.audio.segments[0].audio_path,
          filename: `${currentLecture.lecture_meta.title}_AI강의_오디오.mp3`
        };
        const res = await fetch("/api/upload_drive", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert(`✅ 구글 드라이브 업로드 성공!\n파일 링크: ${data.view_link}`);
          window.open(data.view_link, "_blank");
        } else {
          alert(`⚠️ 업로드 실패 안내:\n${data.hint || data.error}`);
        }
      } catch (err) {
        alert("업로드 중 오류: " + err.message);
      } finally {
        btn.textContent = "☁️ 구글 드라이브 업로드";
        btn.disabled = false;
      }
    }

    // 초기 실행
    window.addEventListener("DOMContentLoaded", () => {
      renderSentenceTokens(1);
      updateAvatarMotion();
    });
  </script>
</body>
</html>
